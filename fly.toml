# fly.toml app configuration file generated for mouser-cache-api on 2025-05-01T10:43:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mouser-cache-api'
primary_region = 'waw'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
